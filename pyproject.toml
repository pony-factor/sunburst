[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sunburst-sec-comments"
version = "0.1.0"
description = "Ingest and search SEC public comments through SQLite and MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "mcp>=2,<3",
  "pypdf>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
sunburst = "sunburst.cli:main"
sunburst-mcp = "sunburst.server:main"

[tool.hatch.build.targets.wheel]
packages = ["sunburst"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
